[project]
name = "feishu-lite-backend"
version = "0.1.0"
description = "FeishuChat backend: wraps larkx (reverse-engineered Feishu web protocol) behind a local REST + SSE API"
readme = "README.md"
authors = [
    { name = "Reorx", email = "novoreorx@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "larkx @ git+https://github.com/cv-cat/LarkAgentX@2cb4f90fcfd5d7608800291ebb5e912ba6383901",
    "pillow>=12.3.0",
    "qrcode>=8.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
feishu-lite-backend = "feishu_lite.main:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "feishu_lite"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
