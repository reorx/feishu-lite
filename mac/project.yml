name: FeishuChat
options:
  bundleIdPrefix: com.reorx
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# 第三方依赖统一在 FeishuChatCore/Package.swift 声明，app target 传递依赖
packages:
  FeishuChatCore:
    path: FeishuChatCore

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  FeishuChat:
    type: application
    platform: macOS
    sources:
      - FeishuChat
    dependencies:
      - package: FeishuChatCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reorx.FeishuChat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FeishuChat/Info.plist
      properties:
        CFBundleDisplayName: FeishuChat
        LSApplicationCategoryType: public.app-category.social-networking
        # 后端子进程的位置，值来自 Config/Backend.xcconfig
        FeishuBackendDir: $(FEISHU_BACKEND_DIR)
        FeishuUVPath: $(FEISHU_UV_PATH)
    entitlements:
      path: FeishuChat/FeishuChat.entitlements
      properties:
        # 非沙箱：要拉起 uv 子进程（后端），沙箱里做不到
        com.apple.security.app-sandbox: false
